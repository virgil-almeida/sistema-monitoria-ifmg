{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Presença registrada — Monitoria IFMG</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" />
  <style>
    body { background: #f4f6f9; }
    .card-ok { max-width: 440px; margin: 60px auto; }
    .check-icon { font-size: 4rem; }
  </style>
</head>
<body>
  <div class="card-ok card shadow-sm">
    <div class="card-body text-center py-5">
      <div class="check-icon text-success mb-3">✓</div>
      <h4 class="mb-1">Presença registrada!</h4>
      <p class="text-muted mb-4">Sua participação na monitoria foi confirmada com sucesso.</p>
      <dl class="text-left">
        <dt>Turma</dt>
        <dd>{{ sessao.monitor.turma }}</dd>
        <dt>Local</dt>
        <dd>{{ sessao.local }}</dd>
      </dl>
      <p class="text-muted small mt-3">Você pode fechar esta página.</p>
    </div>
  </div>
</body>
</html>
